<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipos | LigaControl</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
  <div class="app-shell">
    <aside class="sidebar championship-sidebar"><a class="back-link" href="dashboard.html">← Mis campeonatos</a><h2 id="sidebar-championship">Campeonato</h2><nav><a href="campeonato.html">Resumen</a><a class="active" href="equipos.html">Equipos</a><a href="partidos.html">Partidos</a><a href="resultados.html">Resultados</a><a href="sanciones.html">Sanciones y pagos</a><a href="reportes.html">Reportes</a><a href="publico.html">Vista pública ↗</a><a href="configuracion.html">Datos del campeonato</a><a href="ajustes.html">Configuración</a></nav></aside>
    <main class="main">
      <header class="topbar"><div><small id="championship-context">Campeonato seleccionado</small><h1>Equipos</h1></div><div class="topbar-actions"><select id="active-discipline" class="context-select" aria-label="Disciplina"></select><button id="open-team-modal" class="action-button" type="button">+ Nuevo equipo</button><button class="theme-toggle" data-theme-toggle>◐ Tema</button></div></header>
      <section class="card championships-panel">
        <div class="section-heading"><div><h2>Equipos registrados <span id="team-count" class="badge">0</span></h2><p class="muted">Equipos participantes del campeonato activo.</p></div><button id="reload-teams" class="secondary-button" type="button">Actualizar</button></div>
        <div id="team-list" class="championship-grid" aria-live="polite"><p class="muted">Cargando…</p></div>
      </section>
    </main>
  </div>
  <dialog id="team-modal" class="app-modal">
    <div class="modal-header"><div><small>Nuevo</small><h2>Registrar equipo</h2><p id="team-modal-context" class="muted"></p></div><button id="close-team-modal" class="icon-button" type="button">×</button></div>
    <form id="team-form" class="form-grid">
      <label class="field field-wide"><span>Nombre del equipo *</span><input name="name" required maxlength="150" placeholder="Ej. Hospital Bambamarca"></label>
      <label class="field"><span>Delegado</span><input name="delegate" maxlength="150" placeholder="Nombre del delegado"></label>
      <label class="field"><span>Teléfono</span><input name="phone" maxlength="20" inputmode="tel" placeholder="Ej. 987654321"></label>
      <label class="field field-wide"><span>Color o descripción del uniforme</span><input name="uniform" maxlength="120" placeholder="Ej. Camiseta azul, short blanco"></label>
      <div class="modal-actions field-wide"><span id="team-form-status" class="form-status" role="status"></span><div class="button-group"><button id="cancel-team-modal" class="secondary-button" type="button">Cancelar</button><button class="action-button" type="submit">Guardar equipo</button></div></div>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script><script type="module" src="js/equipos.js"></script>
</body></html>
